# STE-informed checker configuration. Tuned in Task 6 after the baseline run.
max_sentence_words: 25

callout_prefixes:
  - "For C# developers"
  - "For .NET developers"

placeholder_markers:
  - "TODO"
  - "TBD"
  - "FIXME"
  - "XXX"
  - "lorem ipsum"

# term (case-insensitive, word-boundary) -> suggested replacement shown in the finding
banned:
  leverage: "use"
  utilize: "use"
  "in order to": "to"
  "a number of": "several"
  "under the hood": "remove; describe the mechanism directly"
  munge: "process"
  simply: "remove"
  easily: "remove; state the steps"
  powerful: "remove; state the capability"

# canonical term and the variants that must not appear in prose
terminology:
  - canonical: "element"
    variants: ["tag"]
  - canonical: "transform"
    variants: ["convert", "munge"]
  - canonical: "stylesheet"
    variants: ["style sheet", "style-sheet"]

# analogy terms allowed anywhere (they are technical proper nouns, not idioms)
allow_analogy_terms:
  - "LINQ"
  - "Razor"
  - "Handlebars"
  - "IServiceProvider"
