# STE-informed checker configuration. Tuned in Task 6 after the baseline run.
max_sentence_words: 25

callout_prefixes:
  - "For C# developers"
  - "For .NET developers"

placeholder_markers:
  - "TODO"
  - "TBD"
  - "FIXME"
  - "XXX"
  - "lorem ipsum"

# term (case-insensitive, word-boundary) -> suggested replacement shown in the finding
banned:
  leverage: "use"
  utilize: "use"
  "in order to": "to"
  "a number of": "several"
  "under the hood": "remove; describe the mechanism directly"
  munge: "process"
  simply: "remove"
  easily: "remove; state the steps"
  powerful: "remove; state the capability"

# canonical term and the variants that must not appear in prose
terminology:
  - canonical: "element"
    variants: ["tag"]
  - canonical: "transform"
    # convert/cast/coerce are allowed for type conversion (cast as, treat as,
    # xs:string(), iri-to-uri, etc.) — "transform" is reserved for XSLT /
    # whole-document transformation.
    variants: ["munge"]
  - canonical: "stylesheet"
    variants: ["style sheet", "style-sheet"]

# analogy terms allowed anywhere (they are technical proper nouns, not idioms)
# "String" and "Everything" are also seeded here: the gerund-lead check only
# tests whether the first word ends in "ing", so these non-gerund words
# ("String functions...", "Everything above...") were false-flagged.
allow_analogy_terms:
  - "LINQ"
  - "Razor"
  - "Handlebars"
  - "IServiceProvider"
  - "String"
  - "Everything"

# Task 6 baseline review: passive-voice regex (be/is/are + -ed/-en word) also
# matches adjectival past-participle "state" phrasing that isn't true passive
# voice in technical prose ("the namespace is required", "default is used").
# Phrases here suppress the finding on a line via case-insensitive substring
# match; only phrases actually observed as false positives in the baseline
# are listed, so genuine passive-voice findings elsewhere are untouched.
passive_allow:
  - "is used"
  - "are used"
  - "is called"
  - "are called"
  - "is required"
  - "are required"
